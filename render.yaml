services:
  - type: web
    runtime: static
    name: boat-booth
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @workspace/boat-booth run build
    staticPublishPath: artifacts/boat-booth/dist/public
    envVars:
      - key: NODE_VERSION
        value: 22
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /models/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
